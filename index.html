<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f1117">
  <title>CanvasVerse</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #0f1117;
      color: #f5f7ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    .app {
      width: min(100%, 1000px);
      margin: auto;
      padding: 32px 20px 50px;
    }

    .hero {
      text-align: center;
      padding: 55px 10px 40px;
    }

    .logo {
      font-size: clamp(46px, 11vw, 82px);
      font-weight: 800;
      letter-spacing: -4px;
      line-height: 1;
    }

    .tagline {
      margin-top: 16px;
      color: #aeb5c7;
      font-size: 18px;
      letter-spacing: .3px;
    }

    .age-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 20px;
    }

    .age-card {
      min-height: 230px;
      padding: 28px 20px;
      border: 1px solid #292e3b;
      border-radius: 24px;
      background: #171a23;
      color: white;
      cursor: pointer;
      text-align: left;
      transition: transform .18s ease, border-color .18s ease,
                  background .18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .age-card:hover {
      transform: translateY(-4px);
      border-color: #5c667d;
      background: #1c202b;
    }

    .age-card:active {
      transform: scale(.98);
    }

    .number {
      display: block;
      font-size: 15px;
      color: #8f98ad;
      margin-bottom: 55px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .age-card h2 {
      font-size: 28px;
      margin-bottom: 9px;
    }

    .age-card p {
      color: #aeb5c7;
      line-height: 1.45;
      font-size: 15px;
    }

    .footer {
      text-align: center;
      margin-top: 45px;
      color: #626b80;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .age-grid {
        grid-template-columns: 1fr;
      }

      .age-card {
        min-height: 150px;
      }

      .number {
        margin-bottom: 24px;
      }

      .hero {
        padding-top: 35px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <section class="hero">
      <h1 class="logo">CanvasVerse</h1>
      <p class="tagline">Create. Color. Imagine.</p>
    </section>

    <section class="age-grid">

      <button class="age-card" onclick="chooseAge('3-10')">
        <span class="number">01</span>
        <h2>Ages 3–10</h2>
        <p>Simple, fun coloring experiences made for young artists.</p>
      </button>

      <button class="age-card" onclick="chooseAge('11-15')">
        <span class="number">02</span>
        <h2>Ages 11–15</h2>
        <p>More detailed art, creative tools, shading, and Free Draw.</p>
      </button>

      <button class="age-card" onclick="chooseAge('16+')">
        <span class="number">03</span>
        <h2>Ages 16+</h2>
        <p>A full creative studio for advanced drawing and coloring.</p>
      </button>

    </section>

    <p class="footer">CanvasVerse • Your creativity, your canvas.</p>

  </main>

  <script>
    function chooseAge(age) {
      alert("CanvasVerse • " + age + " selected!");
    }
  </script>

</body>
</html>
